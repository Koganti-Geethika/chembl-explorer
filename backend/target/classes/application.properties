# Server
server.port=8080

# ChEMBL API
chembl.api.base-url=https://www.ebi.ac.uk/chembl/api/data

# Logging
logging.level.com.centella.chembl=INFO
logging.level.org.springframework.web.reactive.function.client=WARN

# Jackson — serialize nulls as null (not missing field), for consistent responses
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# WebFlux codec buffer size (needed for large ChEMBL payloads)
spring.codec.max-in-memory-size=10MB

# Actuator (optional health endpoint)
management.endpoints.web.exposure.include=health,info
